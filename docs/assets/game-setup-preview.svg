<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">JU-DO-KON! Classic Battle setup screen preview</title>
  <desc id="description">A terminal-style game setup screen with Classic Battle selected, Champion as the other mode, and keyboard instructions.</desc>
  <rect width="1280" height="720" fill="#071006"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d8ffd8">
    <text x="150" y="44" font-size="19" font-weight="700">bash - JU-DO-KON</text>
    <text x="1130" y="44" text-anchor="end" font-size="14" fill="#a4caa4">Classic · Absolute division · First to 3</text>
    <path d="M150 63H1130" stroke="#4e894e"/>

    <text x="200" y="160" font-size="14" letter-spacing="2" fill="#8ee58e">BUDOKON TERMINAL · 2600</text>
    <text x="200" y="236" font-size="54" font-weight="700" letter-spacing="-3">ENTER THE</text>
    <text x="200" y="293" font-size="54" font-weight="700" letter-spacing="-3">JUDOKA CIRCUIT.</text>
    <text x="200" y="347" font-size="17" fill="#b3cdb3">Choose your format, then read the</text>
    <text x="200" y="373" font-size="17" fill="#b3cdb3">opponent and build a run one point</text>
    <text x="200" y="399" font-size="17" fill="#b3cdb3">at a time.</text>
    <text x="200" y="451" font-size="15" fill="#8ee58e">System ready. Configure your match <tspan>█</tspan></text>

    <rect x="624" y="112" width="456" height="450" fill="#091208" stroke="#75c775" stroke-width="2"/>
    <text x="650" y="147" font-size="13" letter-spacing="1.5" fill="#a4caa4">MATCH SETUP</text>
    <text x="650" y="190" font-size="19" font-weight="700" fill="#8ee58e">Choose game mode</text>

    <rect x="650" y="211" width="404" height="104" fill="#214a21" stroke="#8ee58e" stroke-width="2"/>
    <text x="671" y="252" font-size="21" font-weight="700" fill="#8ee58e">&gt;</text>
    <text x="705" y="250" font-size="17" font-weight="700">Classic Battle</text>
    <text x="705" y="279" font-size="13" fill="#b3cdb3">Fresh matchups</text>
    <rect x="994" y="235" width="38" height="34" fill="#102110" stroke="#417841"/>
    <text x="1013" y="258" text-anchor="middle" font-size="15">C</text>

    <rect x="650" y="326" width="404" height="104" fill="#091208" stroke="#417841"/>
    <text x="671" y="367" font-size="21" fill="#a4caa4">›</text>
    <text x="705" y="365" font-size="17" font-weight="700">Champion</text>
    <text x="705" y="394" font-size="13" fill="#b3cdb3">Build a streak</text>
    <rect x="994" y="350" width="38" height="34" fill="#102110" stroke="#417841"/>
    <text x="1013" y="373" text-anchor="middle" font-size="15">H</text>

    <text x="650" y="460" font-size="13" fill="#a4caa4"><tspan fill="#8ee58e">↑ ↓</tspan> move  ·  Enter select</text>
    <text x="650" y="501" font-size="13" fill="#a4caa4">Draw fresh opponents for every round.</text>
    <text x="852" y="545" text-anchor="middle" font-size="12" fill="#a4caa4">Setup unfolds one choice at a time.</text>

    <path d="M150 613H1130" stroke="#4e894e"/>
    <rect x="150" y="634" width="186" height="42" fill="#091208" stroke="#417841"/>
    <text x="243" y="661" text-anchor="middle" font-size="14" fill="#b3cdb3"><tspan fill="#8ee58e">C / H</tspan>  Game mode</text>
    <rect x="821" y="634" width="145" height="42" fill="#091208" stroke="#417841"/>
    <text x="893" y="661" text-anchor="middle" font-size="13" fill="#b3cdb3">Seed: Random</text>
    <rect x="978" y="634" width="152" height="42" fill="#091208" stroke="#417841"/>
    <text x="1054" y="661" text-anchor="middle" font-size="13" fill="#b3cdb3">Sound: Off</text>
  </g>
</svg>

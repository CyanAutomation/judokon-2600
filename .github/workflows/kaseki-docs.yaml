name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@${{ github.event.repository.default_branch }}

permissions:
  contents: read

concurrency:
  group: kaseki-docs-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docs_sweep:
    uses: ./.github/workflows/kaseki-sweep.yml
    with:
      sweep_name: documentation
      task_description: Keep README.md and docs/ accurate against the current implementation.
      allowlist: README.md,docs/**/*.md
      task_prompt: >-
        Perform the documentation sweep for this repository. First read repository
        instructions, then inspect the current implementation and compare it against
        README.md and documentation under docs/. Update documentation only where
        inaccurate, incomplete, or stale. Do not modify application code, tests,
        configuration, dependencies, lockfiles, CI workflows, or generated files.
        Do not invent behavior. Avoid cosmetic rewrites. Before finishing, review
        the diff to confirm it contains documentation-only changes. If documentation
        is already accurate, make no changes and do not open a pull request.
    secrets: inherit

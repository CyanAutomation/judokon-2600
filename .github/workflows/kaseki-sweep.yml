name: Kaseki Sweep

on:
  workflow_call:
    inputs:
      sweep_name:
        required: true
        type: string
      task_description:
        required: true
        type: string
      allowlist:
        required: true
        type: string
      task_prompt:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sweep:
    name: Run Kaseki ${{ inputs.sweep_name }} sweep
    runs-on: ubuntu-latest
    timeout-minutes: 200
    environment: kaseki-agent
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: ${{ github.event.repository.default_branch }}
      TASK_DESCRIPTION: ${{ inputs.task_description }}
      ALLOWLIST: ${{ inputs.allowlist }}
      TASK_PROMPT: ${{ inputs.task_prompt }}
      VALIDATION_COMMAND: npm run check
      POLLING_BUDGET_SECONDS: 10500
    steps:
      - name: Validate Kaseki configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?Configure KASEKI_BASE_URL as an environment variable}"
          : "${KASEKI_API_TOKEN:?Configure KASEKI_API_TOKEN as an environment secret}"
          if [[ ! "$KASEKI_BASE_URL" =~ ^https:// ]]; then
            echo "::error title=Invalid Kaseki URL::KASEKI_BASE_URL must use HTTPS"
            exit 1
          fi
          if [[ "$KASEKI_BASE_URL" =~ [@[:space:]] ]]; then
            echo "::error title=Invalid Kaseki URL::KASEKI_BASE_URL must not contain credentials or whitespace"
            exit 1
          fi

      - name: Verify controller health
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --output "$response_file" \
            "$KASEKI_BASE_URL/health"
          jq -e '.status == "healthy"' "$response_file" >/dev/null

      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --output "$response_file" \
            "$KASEKI_BASE_URL/ready"
          jq -e '.status == "ready"' "$response_file" >/dev/null

      - name: Verify gateway connectivity and authentication
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/gateway-test?stage=1"
          jq -e '.status == "ok"' "$response_file" >/dev/null

      - name: Submit ${{ inputs.sweep_name }} sweep
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          idempotency_key="$(tr '[:upper:]' '[:lower:]' < /proc/sys/kernel/random/uuid)"
          if [[ ! "$idempotency_key" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error title=Invalid UUID generation::Failed to generate valid idempotency key"
            exit 1
          fi
          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg taskPrompt "$TASK_PROMPT" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                taskMode: "patch",
                timeoutSeconds: 10800,
                idempotencyKey: $idempotencyKey,
                changedFilesAllowlist: ($allowlist | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))),
                validationCommands: [$validationCommand],
                goalCheck: { enabled: true, maxRetries: 1 },
                taskPrompt: ($taskDescription + "\n\n" + $taskPrompt)
              }'
          )"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(
            curl --silent --show-error --retry 3 --retry-all-errors --max-time 60 \
              --output "$response_file" --write-out '%{http_code}' --request POST \
              "$KASEKI_BASE_URL/api/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" --data "$payload"
          )"
          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"
            exit 1
          fi
          run_id="$(jq -er '.id' "$response_file")"
          if [[ ${#run_id} -gt 128 || ${#run_id} -lt 1 || "$run_id" == *[!A-Za-z0-9_-]* ]]; then
            echo "::error title=Invalid Kaseki run ID::Controller returned an invalid run ID"
            exit 1
          fi
          delimiter="$(uuidgen)"
          if [[ "$run_id" == *"$delimiter"* ]]; then
            echo "::error title=Delimiter collision::Generated delimiter appears in run_id"
            exit 1
          fi
          {
            echo "run_id<<$delimiter"
            echo "$run_id"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for Kaseki completion
        id: wait
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          deadline=$((SECONDS + POLLING_BUDGET_SECONDS))
          while (( SECONDS < deadline )); do
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 --output "$response_file" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/runs/$RUN_ID/status"
            status="$(jq -er '.status' "$response_file")"
            case "$status" in
              completed)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failed)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              queued|running)
                echo "Kaseki status: $status"
                sleep 60
                ;;
              *)
                echo "::error title=Unexpected Kaseki status::Controller returned an unsupported status"
                exit 1
                ;;
            esac
          done
          echo "::error title=Kaseki run timed out::No terminal status after $((POLLING_BUDGET_SECONDS / 60)) minutes"
          exit 1

      - name: Publish run details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          FINAL_STATUS: ${{ steps.wait.outputs.status || 'not completed' }}
        run: |
          {
            echo "## Kaseki ${{ inputs.sweep_name }} sweep"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Allowed paths | \`$ALLOWLIST\` |"
            echo "| Validation | \`$VALIDATION_COMMAND\` |"
            echo "| Kaseki run | \`$RUN_ID\` |"
            echo "| Final status | \`$FINAL_STATUS\` |"
          } >> "$GITHUB_STEP_SUMMARY"

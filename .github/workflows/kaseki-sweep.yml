name: Soyuz Kaseki Sweep

on:
  workflow_call:
    inputs:
      sweep_name:
        required: true
        type: string
      task_description:
        required: true
        type: string
      allowlist:
        required: true
        type: string
      task_prompt:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sweep:
    name: Submit ${{ inputs.sweep_name }} sweep to Soyuz
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.workflow_ref == format('{0}/.github/workflows/kaseki-docs.yaml@refs/heads/main', github.repository) ||
       github.workflow_ref == format('{0}/.github/workflows/kaseki-dry.yaml@refs/heads/main', github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: soyuz
    env:
      SOYUZ_BASE_URL: ${{ vars.SOYUZ_BASE_URL }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: main
      TASK_DESCRIPTION: ${{ inputs.task_description }}
      ALLOWLIST: ${{ inputs.allowlist }}
      TASK_PROMPT: ${{ inputs.task_prompt }}
      SWEEP_NAME: ${{ inputs.sweep_name }}
      VALIDATION_COMMAND: npm run check
    steps:
      - name: Monitor runner egress
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Validate Soyuz URL and sweep configuration
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/validate-soyuz-url.ts
          case "$SWEEP_NAME:$ALLOWLIST" in
            'documentation:README.md,docs/**/*.md'|'DRY:src/**/*,api/**/*,scripts/**/*,test/**/*,tests/**/*')
              ;;
            *)
              echo "::error title=Invalid Soyuz sweep configuration::Only the approved main-branch sweep profiles are allowed."
              exit 1
              ;;
          esac

      - name: Submit ${{ inputs.sweep_name }} sweep to Soyuz
        id: submit
        shell: bash
        env:
          SOYUZ_SUBMISSION_API_TOKEN: ${{ secrets.SOYUZ_SUBMISSION_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${SOYUZ_SUBMISSION_API_TOKEN:?Configure SOYUZ_SUBMISSION_API_TOKEN as an environment secret}"

          idempotency_key="$(tr '[:upper:]' '[:lower:]' < /proc/sys/kernel/random/uuid)"
          if [[ ! "$idempotency_key" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error title=Invalid UUID generation::Failed to generate a valid idempotency key."
            exit 1
          fi

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg taskPrompt "$TASK_PROMPT" \
              --arg sweepName "$SWEEP_NAME" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                maxDiffBytes: 102400,
                idempotencyKey: $idempotencyKey,
                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),
                validationCommands: [$validationCommand],
                goalCheck: { enabled: true, maxRetries: 1 },
                taskPrompt: ($taskDescription + "\n\n" + $taskPrompt)
              }
              | if $sweepName == "documentation" then
                  . + {scouting: {enabled: false}, goalSetting: {enabled: false}}
                else . end'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --max-filesize 1048576 --output "$response_file" \
              --write-out '%{http_code}' --request POST "$SOYUZ_BASE_URL/v1/runs" \
              --header "Authorization: Bearer $SOYUZ_SUBMISSION_API_TOKEN" \
              --header "Idempotency-Key: $idempotency_key" \
              --header 'Content-Type: application/json' \
              --data "$payload" || true
          )"

          if [[ ! "$http_status" =~ ^(200|202)$ ]]; then
            echo "::error title=Soyuz submission failed::Soyuz returned HTTP ${http_status:-unknown}. Response body omitted."
            {
              echo "Soyuz returned HTTP \`${http_status:-unknown}\`. Response body omitted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          run_id="$(jq -er '.data.id | strings' "$response_file")"
          run_id="$(SOYUZ_RUN_ID="$run_id" node --experimental-strip-types scripts/validate-soyuz-run-id.ts)"
          display_id="$(jq -er '.data.displayId | strings | select(test("^soyuz-[0-9]+$"))' "$response_file")"
          run_status="$(jq -er '.data.status | strings | select(test("^(admitting|queued|claimed|running|cancel_requested|cancelled|completed|failed|admission_failed)$"))' "$response_file")"

          {
            printf 'run_id=%s\n' "$run_id"
            printf 'display_id=%s\n' "$display_id"
            printf 'run_status=%s\n' "$run_status"
            printf 'submission_status=accepted\n'
          } >> "$GITHUB_OUTPUT"
          echo "Soyuz accepted the $SWEEP_NAME sweep as $display_id."

      - name: Publish Soyuz submission details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          DISPLAY_ID: ${{ steps.submit.outputs.display_id || 'not assigned' }}
          RUN_STATUS: ${{ steps.submit.outputs.run_status || 'not received' }}
          SUBMISSION_STATUS: ${{ steps.submit.outputs.submission_status || 'not accepted' }}
        run: |
          {
            printf '## Soyuz %s submission\n' "$SWEEP_NAME"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Allowed paths | \`$ALLOWLIST\` |"
            echo "| Validation | \`$VALIDATION_COMMAND\` |"
            echo "| Submission | \`$SUBMISSION_STATUS\` |"
            echo "| Soyuz run | \`$DISPLAY_ID\` (\`$RUN_ID\`) |"
            echo "| Run status at submission | \`$RUN_STATUS\` |"
            echo
            echo "Accepted means Soyuz admitted the task; it does not confirm execution completion. Monitor the run in the Soyuz dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
